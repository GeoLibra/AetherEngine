name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Typecheck, tests, build, and benchmark routing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit and contract tests
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Validate benchmark manifest
        run: pnpm bench validate
      - name: Run changed benchmark smoke suites
        run: pnpm bench changed

  rhi-standard-benchmark:
    name: RHI standard benchmark artifact
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run RHI standard profile
        run: node benchmark/rhi-command-runner.mjs standard
      - name: Upload RHI standard artifact
        uses: actions/upload-artifact@v4
        with:
          name: rhi-standard-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark/artifacts/rhi/rhi-command-standard-*.json
          if-no-files-found: error
          retention-days: 30
